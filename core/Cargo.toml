[package]
name = "jinject-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "jinject_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
isideload = { version = "0.5.2", default-features = false, features = ["install", "fs-storage", "tokio-mt"] }
idevice = { version = "0.1.68", default-features = false, features = ["ring", "afc", "installation_proxy", "house_arrest", "tcp", "usbmuxd", "pair"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rootcause = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
once_cell = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "system-proxy"] }
apple-codesign-quick = "0.1.0"
x509-cert = "0.2.5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rsa = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rand = "0.8"
