name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 15, iOS 26.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options: [Setup / bootstrap, Sign-in / 2FA, Install, Refresh, Run inside, JIT, Certificates / export, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Log tab → share button. Remove anything private (emails, team IDs) before pasting.
      render: text
